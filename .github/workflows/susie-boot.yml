      - name: Boot Susie ISO
        run: |
          set +e

          timeout 20s qemu-system-x86_64 \
            -M pc \
            -m 512M \
            -cdrom susie-beta-0.1.iso \
            -boot d \
            -nographic \
            > susie-boot.log 2>&1

          QEMU_STATUS=$?

          cat susie-boot.log

          if [ "$QEMU_STATUS" -ne 0 ] && [ "$QEMU_STATUS" -ne 124 ]; then
            echo "❌ QEMU failed."
            exit "$QEMU_STATUS"
          fi
